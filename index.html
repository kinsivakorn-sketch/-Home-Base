<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Base</title>
<meta name="description" content="Home Base: news, today, schedule, goals, diary, routine and finance in one place.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Base">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap">
<style>
/* Layout: one narrow column, black on white, hairlines instead of cards. Excel-style sheet tabs pinned to the bottom.
   The only colour is a single accent that follows the weekday (or stays black/white when switched off). */
:root{
  --bg:#FFFFFF;--surface-2:#F4F4F4;--ink:#0A0A0A;--muted:#6B6B6B;--line:#E3E3E3;
  --accent:#0A0A0A;--accent-ink:#FFFFFF;--scrim:rgba(0,0,0,.45);--star:#C47F00;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --label:var(--mono);
  --k-stock:var(--accent);
  --k-fund:color-mix(in srgb,var(--ink) 66%,var(--bg));
  --k-cash:color-mix(in srgb,var(--ink) 38%,var(--bg));
  --k-gold:color-mix(in srgb,var(--ink) 20%,var(--bg));
  --k-other:color-mix(in srgb,var(--ink) 9%,var(--bg));
}
:root:lang(th){--label:var(--font)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B0B0B;--surface-2:#171717;--ink:#F4F4F4;--muted:#9B9B9B;--line:#2B2B2B;--accent:#F4F4F4;--accent-ink:#0B0B0B;--scrim:rgba(0,0,0,.65);--star:#F5B83D;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0B0B0B;--surface-2:#171717;--ink:#F4F4F4;--muted:#9B9B9B;--line:#2B2B2B;--accent:#F4F4F4;--accent-ink:#0B0B0B;--scrim:rgba(0,0,0,.65);--star:#F5B83D;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);
  padding-block:0 calc(72px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.wrap{max-width:680px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
small{font-size:12.5px;color:var(--muted)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:22px}
.eyebrow{font:500 11.5px/1.4 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
:root:lang(th) .eyebrow{letter-spacing:0;text-transform:none;font-size:13px}
h1{font:600 30px/1.15 var(--font);letter-spacing:-.01em}
h1.big{font-size:38px;font-weight:300;letter-spacing:-.02em}
.top-r{display:flex;align-items:center;gap:2px;flex:none}
.status{font:11.5px var(--mono);color:var(--muted)}
.icon{flex:none;width:40px;height:40px;border:0;background:none;color:var(--ink);display:inline-grid;place-items:center;border-radius:10px;padding:0}
.icon:hover{background:var(--surface-2)}
.icon.dim{color:var(--muted)}
.link-btn{border:0;background:none;color:var(--ink);padding:4px 2px;font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px}

main{padding-top:18px;display:grid;gap:26px;align-content:start}
.sec{display:grid;gap:0;align-content:start}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.sec-h h2{font:600 12px/1.4 var(--label);letter-spacing:.1em;text-transform:uppercase}
:root:lang(th) .sec-h h2{letter-spacing:0;text-transform:none;font-size:14px}
.row-h{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* controls */
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:0 16px;min-height:44px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.quiet{border-color:var(--line)}
.btn.wide{width:100%}
.btn.danger{border-color:var(--line)}
.btn.danger.armed{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;border:1px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:none;min-height:40px;font-weight:500;color:var(--muted);padding:0 6px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
@media(prefers-reduced-motion:no-preference){.bar>i{transition:width .3s ease}}
.pill{display:inline-block;font:500 10.5px/1 var(--label);letter-spacing:.04em;padding:3px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;vertical-align:middle}
.pill.ink{border-color:var(--ink);color:var(--ink)}
:root:lang(th) .pill{font-size:11.5px;letter-spacing:0}

.note{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.note.warn{color:var(--ink);border-bottom-color:var(--ink)}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;display:grid;gap:12px;justify-items:center;margin-top:12px}
.sk{height:14px;border-radius:6px;background:var(--surface-2);margin-top:14px}

/* stat boxes */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{border:1px solid var(--ink);border-radius:14px;padding:14px 16px;display:grid;gap:2px}
.stats.three .stat{border-color:var(--line);padding:12px}
.sn{font:500 44px/1.1 var(--mono)}
.stats.three .sn{font-size:20px}
.sl{font-size:13px;color:var(--muted)}

/* Good morning */
.lede{color:var(--muted);font-size:14px;margin-top:6px}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.news-sec{display:grid;gap:0}
.sym-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:6px}
.sym-h h3{font:600 26px/1.2 var(--mono);letter-spacing:-.01em}
.news{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.news:last-child{border-bottom:0}
.meta{font:500 11.5px/1.4 var(--label);color:var(--muted);letter-spacing:.04em}
:root:lang(th) .meta{font-size:12.5px;letter-spacing:0}
.news h3{font:600 20px/1.35 var(--font);letter-spacing:-.005em}
.news>p:not(.meta){font-size:15px;line-height:1.7;color:color-mix(in srgb,var(--ink) 82%,var(--bg))}
.more{font-size:13.5px;font-weight:500;justify-self:start}
.src-note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* tasks */
.add-inline{display:flex;gap:8px}
.add-inline .inp{flex:1;min-width:0}
.list>li{border-bottom:1px solid var(--line)}
.task{display:flex;align-items:center;gap:14px;padding:12px 0}
.chk-btn{flex:none;border:0;background:none;padding:10px;margin:-10px;display:grid;place-items:center;border-radius:50%}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;color:var(--accent-ink)}
.chk svg{opacity:0}
[aria-checked="true"]>.chk{background:var(--accent);border-color:var(--accent)}
[aria-checked="true"]>.chk svg{opacity:1}
.chk-btn:disabled{opacity:.35;cursor:default}
.task-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;display:grid;gap:2px}
.task-t{font-weight:500;overflow-wrap:anywhere}
.task-m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task.is-done{opacity:.55}
.task.is-done .task-t{color:var(--muted);text-decoration:line-through;font-weight:400}
/* important tasks: gold star plus a thin gold bar in the margin (so it never relies on colour alone) */
.task{position:relative}
.task.is-star::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--star)}
.task.is-star .task-t{font-weight:600}
.star{flex:none;width:40px;height:40px;margin:-8px -10px -8px 0;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:10px;padding:0}
.star svg{display:block;fill:none}
.star:hover{background:var(--surface-2)}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg{fill:currentColor}
/* Today: type a task, pick a time, press Enter */
.qa{display:grid;gap:8px;padding:12px 0}
.qa-row{display:flex;gap:8px}
.qa-row .inp{min-width:0;flex:1}
.qa-row .inp[type=time]{flex:none;width:122px;padding:10px 8px}
.qa .err{margin:0}
.qa-hint{font-size:12.5px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sec-h .r2{display:flex;align-items:center;gap:12px}
.pk[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
/* celebration when a task is ticked off */
.fx{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.fx>*{position:absolute;left:0;top:0;will-change:transform,opacity;line-height:1;user-select:none}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h h2{font:600 18px var(--font)}
.cal-h .r{display:flex;align-items:center;gap:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:8px}
.cal .wd{text-align:center;font:500 11px var(--label);color:var(--muted);padding:6px 0}
.cal button{min-height:46px;border:0;background:none;border-radius:10px;display:grid;place-items:center;align-content:center;gap:3px;padding:0}
.cal .dn{font:500 15px/1 var(--mono)}
.dots{display:flex;gap:3px;height:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal button.sel .dots i{background:var(--accent-ink)}

/* goals */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:3px;align-content:start;min-width:0}
.tile .tl{font:500 10.5px/1.3 var(--label);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
:root:lang(th) .tile .tl{letter-spacing:0;text-transform:none;font-size:12px}
.tile .tn{font:500 28px/1.1 var(--mono);margin-top:4px}
.tile .tu{font-size:11.5px;color:var(--muted)}
.tile .tt{font-size:12.5px;line-height:1.35;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.goal{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.goal:last-child{border-bottom:0}
.g-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.g-h h3{font:600 17px/1.4 var(--font);overflow-wrap:anywhere}
.g-h .icon{margin:-6px -8px 0 0}
.why{color:var(--muted);font-size:13.5px}
.g-meta{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.g-meta b{color:var(--ink);font-weight:500}
.subs li{display:flex;align-items:center;gap:12px;padding:8px 0}
.subs .st{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.subs li.is-done .st{color:var(--muted);text-decoration:line-through}
.subs .chk{width:20px;height:20px}
.subs .chk svg{width:12px;height:12px}
.subs .icon{width:32px;height:32px;color:var(--muted)}

/* diary */
.box{border:1px solid var(--ink);border-radius:14px;padding:14px;display:grid;gap:10px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.dbox{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;background:none;display:grid;gap:8px;align-content:start;min-height:132px;min-width:0}
.dbox .dd{font:500 28px/1 var(--mono)}
.dbox .dm{font-size:11.5px;color:var(--muted);margin-top:-4px}
.dbox p{font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}

/* routine */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wk button{border:1px solid transparent;border-radius:12px;background:none;padding:8px 0 6px;display:grid;justify-items:center;gap:5px}
.wk button[aria-pressed="true"]{border-color:var(--ink)}
.wk .wl{font:500 11px var(--label);color:var(--muted)}
.wk .today .wl{color:var(--ink);font-weight:600}
.ring{position:relative;width:34px;height:34px}
.ring svg{display:block;width:100%;height:100%}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--mono)}
.grp-h{font:500 12px var(--label);color:var(--muted);padding:14px 0 2px}
.rg{width:100%;border-collapse:collapse}
.rg th{font:500 11px var(--label);color:var(--muted);text-align:center;padding:0 0 6px;font-weight:500}
.rg th.today{color:var(--ink);font-weight:600}
.rg td{padding:3px 0;text-align:center;border-top:1px solid var(--line)}
.rg td.n{text-align:left;font-size:13px;padding-right:8px;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:38%}
.dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:none;padding:0;display:inline-grid;place-items:center;color:var(--accent-ink)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.due{border-color:var(--ink)}
.dot:disabled{opacity:.3;cursor:default}
.na{display:inline-block;width:10px;height:10px}
.sp{display:inline-block;width:.9em}

/* finance */
.nw-l{font-size:13px;color:var(--muted)}
.nw{font:500 42px/1.15 var(--mono);letter-spacing:-.01em}
.donut{position:relative;width:208px;height:208px;margin:6px auto 4px}
.donut svg{display:block;width:100%;height:100%}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:0}
.donut .mid b{font:500 28px/1.1 var(--mono)}
.donut .mid span{font-size:12.5px;color:var(--muted)}
.lg li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sw{flex:none;width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.lg .nm{flex:1}
.lg .pc{color:var(--muted);font-size:13px;min-width:44px;text-align:right}
.lg .am{min-width:84px;text-align:right}
.hold{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:13px 0;min-width:0}
.hold .l{display:grid;gap:1px;min-width:0}
.hold .r{display:grid;gap:1px;text-align:right;justify-items:end;flex:none}
.hold b{font-weight:500;overflow-wrap:anywhere}
.fg{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.fg:last-child{border-bottom:0}
.fg-n{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.fg-n .big{font:500 22px/1.2 var(--mono)}
.need{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.need b{font-weight:600}
.catr{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.cat-sec{display:grid;gap:0;margin-top:4px}
.day-h{display:flex;justify-content:space-between;font:500 12px var(--label);color:var(--muted);padding:16px 0 4px}
.tx{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:11px 0}
.tx .l{display:grid;gap:1px;min-width:0}
.tx .l b{font-weight:500;overflow-wrap:anywhere}
.tx .am{font:500 15px var(--mono);flex:none}
.tx .am.in{font-weight:600}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* excel-style sheet tabs */
.xl{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface-2);border-top:1px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.xl::-webkit-scrollbar{display:none}
.xt{flex:none;height:46px;padding:0 18px;border:0;border-right:1px solid var(--line);background:none;color:var(--muted);font:500 14px var(--font);white-space:nowrap}
.xt[aria-current="page"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent);margin-top:-1px;padding-top:1px}

/* modal */
.ov{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:end center;z-index:50}
@media(min-width:640px){.ov{place-items:center;padding:24px}}
.mdl{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px;border:1px solid var(--ink);
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media(min-width:640px){.mdl{border-radius:18px}}
.mdl h2{font:600 18px/1.3 var(--font);margin-bottom:16px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:13px;color:var(--muted);font-weight:500}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.inp:focus{border-color:var(--ink);outline:0}
.inp[type=number]{-moz-appearance:textfield;appearance:textfield}
.inp[type=number]::-webkit-outer-spin-button,.inp[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea.inp{min-height:96px;resize:vertical;line-height:1.6}
.inp.big{font:500 28px/1.2 var(--mono);min-height:56px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cp{position:relative}
.cp input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.cp span{display:grid;place-items:center;min-width:44px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13.5px}
.cp input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cp input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.err{font-size:13.5px;margin-bottom:12px;padding:8px 12px;border:1px solid var(--ink);border-radius:10px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}

<body>
<div class="wrap">
  <header class="top">
    <div><p class="eyebrow" id="eyebrow"></p><h1 id="ptitle"></h1></div>
    <div class="top-r"><span class="status" id="status" role="status" aria-live="polite"></span>
      <button class="icon" data-act="settings" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[].slice.call(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const num=v=>{const n=typeof v==='number'?v:parseFloat(v);return Number.isFinite(n)?n:0};
const pnum=s=>{const n=parseFloat(String(s).replace(/,/g,''));return Number.isFinite(n)?n:NaN};
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const baht=v=>'฿'+nf.format(Math.round(num(v)));
const bahtS=v=>(v>=0.5?'+':v<=-0.5?'−':'')+'฿'+nf.format(Math.abs(Math.round(v)));
const compact=v=>{const a=Math.abs(v);return'฿'+(a>=1e6?nf2.format(Math.round(a/1e4)/100)+'M':a>=1e4?nf.format(Math.round(a/1e3))+'K':nf.format(Math.round(a)))};
const pcS=v=>(v>0.005?'+':v<-0.005?'−':'')+nf2.format(Math.abs(v))+'%';
const safeUrl=u=>{u=String(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
const cleanSym=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9&.\-]/g,'').slice(0,12);

const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const p=String(k).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1,12)};
const todayKey=()=>dateKey(new Date());
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const dayDiff=(a,b)=>Math.round((fromKey(b)-fromKey(a))/864e5);
const wdi=d=>(d.getDay()+6)%7; /* Monday-first index */
const isKey=k=>/^\d{4}-\d{2}-\d{2}$/.test(String(k||''));

/* language: x(english, thai) */
let lang='th';
const x=(en,th)=>lang==='th'?th:en;
const LOC=()=>lang==='th'?'th-TH-u-ca-gregory':'en-GB';
const fmt=(d,o)=>d.toLocaleDateString(LOC(),o);
const fDay=d=>fmt(d,{weekday:'long',day:'numeric',month:'long'});
const fShort=d=>fmt(d,{day:'numeric',month:'short'});
const fMonth=d=>fmt(d,{month:'long',year:'numeric'});
const wdName=(i,style)=>fmt(new Date(2024,0,1+i,12),{weekday:style||'short'}).replace('.','');

const CHECK='<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const PEN='<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 3.5l3 3L7 16l-4 1 1-4z"/></svg>';
const PLUS='<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>';
const XIC='<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>';
const STAR='<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 17.1 6.7 19.9l1.1-6L3.4 9.7l6-.8z"/></svg>';
const FUNNEL='<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h14l-5.3 6.4v4.6l-3.4 1.7v-6.3z"/></svg>';
const CHEV=d=>'<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(d<0?'M12.5 4.5L7 10l5.5 5.5':'M7.5 4.5L13 10l-5.5 5.5')+'"/></svg>';
const SP='<span class="sp" aria-hidden="true"></span>';
const empty=(msg,btn,act,data)=>'<div class="empty"><p>'+msg+'</p>'+(btn?'<button class="btn sm" data-act="'+act+'" '+(data||'')+'>'+btn+'</button>':'')+'</div>';

/* ---------- sample content translations (Thai overlay for items flagged seed:true) ---------- */
const TH_SEED={};
const tr=(o,f,id)=>{id=id||o.id;const s=lang==='th'&&o&&o.seed&&TH_SEED[id];return(s&&s[f])||o[f]||''};

/* ---------- state ---------- */
const BASE=['settings','brief','goals','schedule','routines','money','fingoals','inbox'];
const MONTHLY=/^(diary|txn)-\d{4}-\d{2}$/;
const isDoc=n=>BASE.indexOf(n)>-1||MONTHLY.test(n);
const baseOf=n=>n.replace(/-\d{4}-\d{2}$/,'');
const DEF={
  settings:()=>({lang:'th',theme:'auto',wk:true,colors:{},notify:false}),
  brief:()=>({date:'',updatedAt:'',market:[],stocks:[],prices:{}}),
  goals:()=>({items:[]}),
  schedule:()=>({items:[]}),
  routines:()=>({items:[],log:{}}),
  money:()=>({assets:[],priceAt:null}),
  fingoals:()=>({items:[]}),
  inbox:()=>({items:[]}),
  diary:()=>({entries:{}}),
  txn:()=>({items:[]})
};
function norm(name,d){
  const b=baseOf(name),def=DEF[b](),o=Object.assign({},def,d||{});
  Object.keys(def).forEach(k=>{
    const dv=def[k];
    if(Array.isArray(dv)&&!Array.isArray(o[k]))o[k]=[];
    else if(dv&&typeof dv==='object'&&!Array.isArray(dv)&&(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k])))o[k]={};
  });
  if(b==='goals')o.items.forEach(g=>{if(!Array.isArray(g.subs))g.subs=[]});
  if(b==='schedule')o.items.forEach(i=>{if(!Array.isArray(i.doneDates))i.doneDates=[]});
  if(b==='brief'){o.stocks=o.stocks.filter(s=>s&&s.sym);o.stocks.forEach(s=>{if(!Array.isArray(s.items))s.items=[]})}
  return o;
}
let S={};
BASE.forEach(n=>{S[n]=norm(n,{})});
let col=null,userId=null,dbReady=false,loaded=false,confirmed=false,slow=false,loadError=false,sampleFn=null;
const VIEW_IDS=['brief','today','sched','goals','diary','routine','fin'];
let view='brief',saveState='idle',slowT=null,lastKey=todayKey();
let selDate=todayKey(),calMonth=new Date(),rtDay=todayKey(),finTab='port',flowYm=todayKey().slice(0,7),diaryKey=todayKey(),dTimer=null;
calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth(),1,12);
const HOST_THEME=document.documentElement.getAttribute('data-theme');

/* ---------- theme / language / weekday colour ---------- */
const COLORS={mono:null,red:'#E5484D',orange:'#F76B15',yellow:'#F5C400',green:'#30A46C',blue:'#3E63DD',purple:'#8E4EC6',pink:'#D6409F'};
const COLOR_ORDER=['mono','red','orange','yellow','green','blue','purple','pink'];
const COLOR_NAME={mono:['Black / white','ขาวดำ'],red:['Red','แดง'],orange:['Orange','ส้ม'],yellow:['Yellow','เหลือง'],green:['Green','เขียว'],blue:['Blue','น้ำเงิน'],purple:['Purple','ม่วง'],pink:['Pink','ชมพู']};
const DEF_DAY={1:'yellow',2:'pink',3:'green',4:'orange',5:'blue',6:'purple',0:'red'}; /* by JS getDay() */
function colorOf(day){const s=S.settings;if(!s.wk)return'mono';const c=s.colors&&s.colors[day];return COLORS.hasOwnProperty(c)?c:DEF_DAY[day]}
function hexInk(h){const n=parseInt(h.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return(0.2126*r+0.7152*g+0.0722*b)/255>0.6?'#0A0A0A':'#FFFFFF'}
function applyTheme(){
  const r=document.documentElement,s=S.settings;
  if(s.theme==='light'||s.theme==='dark')r.setAttribute('data-theme',s.theme);
  else if(HOST_THEME)r.setAttribute('data-theme',HOST_THEME);else r.removeAttribute('data-theme');
  const h=COLORS[colorOf(new Date().getDay())];
  if(h){r.style.setProperty('--accent',h);r.style.setProperty('--accent-ink',hexInk(h))}
  else{r.style.setProperty('--accent','var(--ink)');r.style.setProperty('--accent-ink','var(--bg)')}
  lang=s.lang==='en'?'en':'th';r.lang=lang;
}

/* ---------- saving ---------- */
const dirty={},timers={},busy={};
const pending=()=>Object.keys(dirty).some(k=>dirty[k]||busy[k]||timers[k]);
function pruned(n){
  const d=JSON.parse(JSON.stringify(S[n])),b=baseOf(n);
  if(b==='routines'){const ks=Object.keys(d.log).sort();ks.slice(0,Math.max(0,ks.length-90)).forEach(k=>delete d.log[k])}
  if(b==='schedule')d.items.forEach(i=>{if(i.doneDates.length>120)i.doneDates=i.doneDates.sort().slice(-120)});
  if(b==='inbox'&&d.items.length>200)d.items=d.items.slice(-200);
  return d;
}
function touch(n){dirty[n]=true;clearTimeout(timers[n]);timers[n]=setTimeout(()=>flush(n),500);setSave('saving')}
async function flush(n,retried){
  timers[n]=null;
  if(!col||!dirty[n])return;
  if(busy[n]){timers[n]=setTimeout(()=>flush(n),300);return}
  dirty[n]=false;busy[n]=true;
  try{await col.doc(n).set(pruned(n))}
  catch(e){
    dirty[n]=true;busy[n]=false;
    if(e&&e.code==='unavailable'&&!retried){timers[n]=setTimeout(()=>flush(n,true),1000+Math.random()*1000);return}
    setSave('error');return;
  }
  busy[n]=false;
  if(dirty[n]){timers[n]=setTimeout(()=>flush(n),100)}
  else if(!pending())setSave('saved');
}
function setSave(s){saveState=s;paintStatus()}
function paintStatus(){
  const el=$('#status');if(!el)return;
  if(saveState==='error'){el.innerHTML='<button class="link-btn" data-act="retry">'+x('Not saved. Retry','บันทึกไม่สำเร็จ ลองอีกครั้ง')+'</button>';return}
  el.textContent=(loaded&&!dbReady)?x('Not saving','ยังไม่บันทึก'):saveState==='saving'?x('Saving…','กำลังบันทึก…'):saveState==='saved'?x('Saved','บันทึกแล้ว'):'';
}
function ensureDoc(n){if(!S[n])S[n]=norm(n,{});return S[n]}

/* ---------- derived: schedule ---------- */
const timeCmp=(a,b)=>((a.time||'99:99')+a.title).localeCompare((b.time||'99:99')+b.title);
function occursOn(it,key){
  if(!isKey(it.date))return false;
  if(it.repeat==='daily')return key>=it.date;
  if(key<it.date)return false;
  if(!it.repeat||it.repeat==='none')return key===it.date;
  const a=fromKey(it.date),b=fromKey(key);
  if(it.repeat==='weekdays')return b.getDay()>=1&&b.getDay()<=5;
  if(it.repeat==='weekly')return a.getDay()===b.getDay();
  if(it.repeat==='monthly')return a.getDate()===b.getDate();
  return false;
}
const isDone=(it,key)=>it.doneDates.indexOf(key)>-1;
const isOneOff=it=>!it.repeat||it.repeat==='none';
const isOverdue=(it,key)=>isOneOff(it)&&isKey(it.date)&&it.date<key&&!it.doneDates.length;
const itemsOn=key=>S.schedule.items.filter(i=>occursOn(i,key)).sort(timeCmp);
function todayList(){
  const k=todayKey();
  const rows=S.schedule.items.filter(i=>occursOn(i,k)||isOverdue(i,k)||isDone(i,k)).map(i=>({i:i,over:isOneOff(i)&&i.date<k,done:isDone(i,k)}));
  rows.sort((a,b)=>(a.done-b.done)||(b.over-a.over)||timeCmp(a.i,b.i));
  return rows;
}
const REPEATS=()=>[['none',x('Does not repeat','ไม่ทำซ้ำ')],['daily',x('Every day','ทุกวัน')],['weekdays',x('Weekdays','จันทร์–ศุกร์')],['weekly',x('Every week','ทุกสัปดาห์')],['monthly',x('Every month','ทุกเดือน')]];

/* ---------- derived: routines ---------- */
const rtDue=wd=>S.routines.items.filter(r=>!r.days||!r.days.length||r.days.indexOf(wd)>-1);
const rtDoneSet=k=>new Set(S.routines.log[k]||[]);
function rtStat(d){const due=rtDue(d.getDay()),done=rtDoneSet(dateKey(d)),n=due.filter(r=>done.has(r.id)).length;return{total:due.length,done:n,pct:due.length?n/due.length:0}}
function weekStart(){const d=new Date();d.setHours(12,0,0,0);return addDays(d,-wdi(d))}
function streak(){
  let s=0;const d=new Date();d.setHours(12,0,0,0);
  for(let i=0;i<90;i++,d.setDate(d.getDate()-1)){
    const st=rtStat(d);
    if(!st.total)continue;
    if(st.pct>=0.8)s++;else if(i===0)continue;else break;
  }
  return s;
}
const rtTime=r=>r.time||'';
const period=r=>{const t=rtTime(r);if(!t)return 3;const h=+t.slice(0,2);return h<12?0:h<18?1:2};
const PERIODS=()=>[x('Morning','เช้า'),x('Afternoon','บ่าย'),x('Evening','เย็น'),x('Anytime','ไม่ระบุเวลา')];

/* ---------- derived: goals & finance ---------- */
const TERMS=['short','mid','long'];
const termName=t=>t==='short'?x('Short-term','ระยะสั้น'):t==='mid'?x('Mid-term','ระยะกลาง'):x('Long-term','ระยะยาว');
const termHint=t=>t==='short'?x('about a year or less','ราว 1 ปีหรือน้อยกว่า'):t==='mid'?x('1–5 years','1–5 ปี'):x('5+ years','5 ปีขึ้นไป');
function subStat(g){const n=g.subs.length,d=g.subs.filter(s=>s.done).length;return{n:n,d:d,pct:n?Math.round(d/n*100):0,all:n>0&&d===n}}
const KINDS=['cash','stock','fund','gold','other'];
const kindName=k=>({cash:x('Cash','เงินสด'),stock:x('Stocks','หุ้น'),fund:x('Funds','กองทุน'),gold:x('Gold','ทองคำ'),other:x('Other','อื่นๆ')})[k];
const isUnit=a=>a.kind==='stock'||a.kind==='fund';
const assetVal=a=>isUnit(a)?num(a.qty)*num(a.price):num(a.value);
const assetCost=a=>isUnit(a)?num(a.qty)*num(a.cost):0;
function totals(){
  const by={cash:0,stock:0,fund:0,gold:0,other:0};let net=0,cost=0,mv=0;
  S.money.assets.forEach(a=>{const k=KINDS.indexOf(a.kind)>-1?a.kind:'other',v=assetVal(a);by[k]+=v;net+=v;if(isUnit(a)){cost+=assetCost(a);mv+=v}});
  return{by:by,net:net,cost:cost,mv:mv,pl:mv-cost,plPct:cost>0?(mv-cost)/cost*100:0};
}
function monthsLeft(dateStr){
  if(!isKey(dateStr))return 0;
  const a=new Date(),b=fromKey(dateStr);
  return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()-a.getDate())/30;
}
function needPerMonth(g){
  const n=Math.max(1,Math.round(monthsLeft(g.date))),r=num(g.ret)/100/12,fvSaved=num(g.saved)*Math.pow(1+r,n),gap=num(g.target)-fvSaved;
  if(gap<=0)return 0;
  return r>0?gap*r/(Math.pow(1+r,n)-1):gap/n;
}
const OUT_CATS=['food','transport','shopping','bills','health','fun','other'];
const IN_CATS=['salary','bonus','invest','inother'];
const catName=c=>({food:x('Food','อาหาร'),transport:x('Transport','เดินทาง'),shopping:x('Shopping','ช้อปปิ้ง'),bills:x('Bills','บิล/ค่าบริการ'),health:x('Health','สุขภาพ'),fun:x('Fun','บันเทิง'),other:x('Other','อื่นๆ'),salary:x('Salary','เงินเดือน'),bonus:x('Bonus','โบนัส'),invest:x('Investing','ลงทุน'),inother:x('Other income','รายได้อื่น')})[c]||c;
const srcName=s=>s==='email'?'Email':s==='line'?'LINE':s==='paste'?x('Pasted','วางข้อความ'):'';
const txnDocs=()=>Object.keys(S).filter(k=>k.indexOf('txn-')===0);
const txnsOf=ym=>(S['txn-'+ym]&&S['txn-'+ym].items)||[];
function findTxn(id){const ns=txnDocs();for(let i=0;i<ns.length;i++){const it=S[ns[i]].items.find(t=>t.id===id);if(it)return{doc:ns[i],it:it}}return null}
function addTxns(list){
  let n=0;
  list.forEach(t=>{
    if(!isKey(t.date)||!(num(t.amount)>0))return;
    const doc='txn-'+t.date.slice(0,7),d=ensureDoc(doc);
    if(d.items.some(o=>o.date===t.date&&o.type===t.type&&Math.round(num(o.amount)*100)===Math.round(num(t.amount)*100)&&String(o.note||'')===String(t.note||'')))return;
    d.items.push({id:uid(),date:t.date,type:t.type==='in'?'in':'out',amount:Math.round(num(t.amount)*100)/100,cat:t.cat||(t.type==='in'?'inother':'other'),note:String(t.note||'').slice(0,80),src:t.src||'manual'});
    touch(doc);n++;
  });
  return n;
}

/* diary */
const diaryDocs=()=>Object.keys(S).filter(k=>k.indexOf('diary-')===0);
function diaryAll(){const out=[];diaryDocs().forEach(n=>{const e=S[n].entries;Object.keys(e).forEach(k=>{if(e[k]&&e[k].text)out.push({key:k,e:e[k]})})});out.sort((a,b)=>b.key.localeCompare(a.key));return out}
const diaryGet=k=>{const d=S['diary-'+k.slice(0,7)];return(d&&d.entries[k])||null};
function diarySet(k,text){
  const n='diary-'+k.slice(0,7),d=ensureDoc(n),tx=String(text).replace(/\s+$/,'');
  if(tx.trim())d.entries[k]={text:tx,at:new Date().toISOString()};else delete d.entries[k];
  touch(n);
}
const diaryText=(k)=>{const e=diaryGet(k);return e?tr(e,'text','d_'+k):''};

/* seeds */
const hasSeed=()=>{
  if(['goals','schedule','routines','fingoals'].some(n=>S[n].items.some(i=>i.seed)))return true;
  if(S.money.assets.some(a=>a.seed))return true;
  if(txnDocs().some(n=>S[n].items.some(t=>t.seed)))return true;
  return diaryDocs().some(n=>Object.keys(S[n].entries).some(k=>S[n].entries[k]&&S[n].entries[k].seed));
};
function clearSeeds(){
  ['goals','schedule','routines','fingoals'].forEach(n=>{if(S[n].items.some(i=>i.seed)){S[n].items=S[n].items.filter(i=>!i.seed);touch(n)}});
  if(S.money.assets.some(a=>a.seed)){S.money.assets=S.money.assets.filter(a=>!a.seed);touch('money')}
  txnDocs().forEach(n=>{if(S[n].items.some(t=>t.seed)){S[n].items=S[n].items.filter(t=>!t.seed);touch(n)}});
  diaryDocs().forEach(n=>{let c=false;Object.keys(S[n].entries).forEach(k=>{if(S[n].entries[k]&&S[n].entries[k].seed){delete S[n].entries[k];c=true}});if(c)touch(n)});
}

/* 1 Good morning */
function heldSyms(){const out=[];S.money.assets.forEach(a=>{if(a.kind==='stock'){const s=cleanSym(a.sym||a.name);if(s&&out.indexOf(s)<0)out.push(s)}});return out}
const pickLang=o=>(o&&(o[lang]||o[lang==='th'?'en':'th']))||{title:'',summary:''};
function newsItem(n){
  const c=pickLang(n),u=safeUrl(n.url),dt=isKey(n.date)?fShort(fromKey(n.date)):'';
  return'<article class="news"><p class="meta">'+[esc(n.source||''),esc(dt)].filter(Boolean).join(SP)+'</p><h3>'+esc(c.title)+'</h3>'+(c.summary?'<p>'+esc(c.summary)+'</p>':'')
    +(u?'<a class="more" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+(n.source?x('Read the full story at ','อ่านต่อที่ ')+esc(n.source):x('Read the full story','อ่านต่อที่ต้นทาง'))+' ↗</a>':'')+'</article>';
}

/* 2 Today */
function taskRow(i,key,o){
  o=o||{};const done=isDone(i,key),t=tr(i,'title'),note=tr(i,'note'),meta=[],star=!!i.star;
  if(i.time)meta.push('<span class="mono">'+esc(i.time)+(i.end?'–'+esc(i.end):'')+'</span>');
  if(o.over&&!done)meta.push('<span class="pill ink">'+x('Overdue','เลยกำหนด')+' '+esc(fShort(fromKey(i.date)))+'</span>');
  if(!isOneOff(i))meta.push('<span class="pill">'+esc((REPEATS().find(r=>r[0]===i.repeat)||['',''])[1])+'</span>');
  if(note)meta.push('<span>'+esc(note)+'</span>');
  return'<li class="task'+(done?' is-done':'')+(star?' is-star':'')+'">'+chkBtn(done,t,'data-act="toggleTask" data-id="'+esc(i.id)+'" data-k="'+key+'" data-fk="tk-'+esc(i.id)+'"')
    +'<button class="task-main" data-act="editTask" data-id="'+esc(i.id)+'"><span class="task-t">'+esc(t)+'</span>'+(meta.length?'<span class="task-m">'+meta.join('')+'</span>':'')+'</button>'
    +'<button class="star" data-act="toggleStar" data-id="'+esc(i.id)+'" data-fk="st-'+esc(i.id)+'" aria-pressed="'+star+'" aria-label="'+x('Important','สำคัญ')+'">'+STAR+'</button></li>';
}

/* 4 Goals */
function daysLeftText(g){
  if(!isKey(g.target))return'';
  const d=dayDiff(todayKey(),g.target);
  return d>0?x(nf.format(d)+' days left','เหลืออีก '+nf.format(d)+' วัน'):d===0?x('Due today','ครบกำหนดวันนี้'):x(nf.format(-d)+' days overdue','เลยกำหนด '+nf.format(-d)+' วัน');
}
function goalCard(g){
  const st=subStat(g),title=tr(g,'title'),desc=tr(g,'desc');
  const subs=g.subs.map(s=>'<li class="'+(s.done?'is-done':'')+'">'+chkBtn(s.done,tr(s,'text'),'data-act="toggleSub" data-g="'+esc(g.id)+'" data-id="'+esc(s.id)+'" data-fk="sb-'+esc(s.id)+'"')
    +'<span class="st">'+esc(tr(s,'text'))+'</span><button class="icon" data-act="rmSub" data-g="'+esc(g.id)+'" data-id="'+esc(s.id)+'" aria-label="'+x('Remove step','ลบขั้นตอน')+'">'+XIC+'</button></li>').join('');
  return'<article class="goal"><div class="g-h"><h3>'+esc(title)+(st.all?' <span class="pill ink">'+x('Done','สำเร็จ')+'</span>':'')+'</h3><button class="icon dim" data-act="editGoal" data-id="'+esc(g.id)+'" aria-label="'+x('Edit','แก้ไข')+'">'+PEN+'</button></div>'
    +(desc?'<p class="why">'+esc(desc)+'</p>':'')
    +'<div class="g-meta"><span>'+(isKey(g.target)?x('Target ','ถึงเมื่อ ')+esc(fShort(fromKey(g.target)))+' '+fromKey(g.target).getFullYear():'')+'</span><b class="mono">'+esc(daysLeftText(g))+'</b></div>'
    +(st.n?'<div class="g-meta"><span>'+x('Steps','ขั้นตอน')+' '+st.d+'/'+st.n+'</span><span class="mono">'+st.pct+'%</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+st.pct+'" aria-label="'+esc(title)+'"><i style="width:'+st.pct+'%"></i></div>':'')
    +(subs?'<ul class="subs">'+subs+'</ul>':'')
    +'<form class="add-inline" data-submit="addSub" data-g="'+esc(g.id)+'"><input class="inp" name="t" aria-label="'+x('New step','ขั้นตอนใหม่')+'" placeholder="'+x('Add a step…','เพิ่มขั้นตอน…')+'" maxlength="120" autocomplete="off" data-fk="sub-'+esc(g.id)+'"><button class="btn sm" type="submit" aria-label="'+x('Add step','เพิ่มขั้นตอน')+'">'+PLUS+'</button></form></article>';
}
function vGoals(){
  const tk=todayKey();
  const tiles=TERMS.map(t=>{
    const g=S.goals.items.filter(z=>z.term===t&&isKey(z.target)&&!subStat(z).all).sort((a,b)=>a.target.localeCompare(b.target))[0];
    if(!g)return'<div class="tile"><span class="tl">'+esc(termName(t))+'</span><span class="tn">—</span><span class="tu">'+x('no goal yet','ยังไม่มีเป้าหมาย')+'</span></div>';
    const d=dayDiff(tk,g.target);
    return'<div class="tile"><span class="tl">'+esc(termName(t))+'</span><span class="tn">'+(d<0?'−':'')+nf.format(Math.abs(d))+'</span><span class="tu">'+(d<0?x('days overdue','วันที่เลยกำหนด'):x('days to go','วันที่เหลือ'))+'</span><span class="tt">'+esc(tr(g,'title'))+'</span></div>';
  }).join('');
  let h='<section class="sec"><div class="sec-h"><h2>'+x('Countdown','นับถอยหลัง')+'</h2></div><div class="tiles" style="margin-top:12px">'+tiles+'</div></section>';
  TERMS.forEach(t=>{
    const gs=S.goals.items.filter(g=>g.term===t).sort((a,b)=>(a.target||'9').localeCompare(b.target||'9'));
    h+='<section class="sec"><div class="sec-h"><h2>'+esc(termName(t))+SP+'<span class="sub" style="text-transform:none;letter-spacing:0;font-weight:400">'+esc(termHint(t))+'</span></h2><button class="btn sm" data-act="addGoal" data-term="'+t+'">'+PLUS+x('Add','เพิ่ม')+'</button></div>'
      +(gs.length?gs.map(goalCard).join(''):empty(x('No plan here yet.','ยังไม่มีแผนในหมวดนี้')))+'</section>';
  });
  return h;
}

/* 6 Routine */
function ringSvg(p){
  const C=2*Math.PI*15;
  return'<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="3"/>'+(p>0?'<circle cx="18" cy="18" r="15" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 18 18)"/>':'')+'</svg>';
}
function vRoutine(){
  const ws=weekStart(),tk=todayKey(),sel=fromKey(rtDay);
  let strip='',wd=0,wt=0;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),key=dateKey(d),st=rtStat(d);
    if(key<=tk){wd+=st.done;wt+=st.total}
    strip+='<button class="'+(key===tk?'today':'')+'" data-act="rtDay" data-k="'+key+'" aria-pressed="'+(key===rtDay)+'" aria-label="'+esc(fDay(d))+(st.total?', '+st.done+'/'+st.total:'')+'"><span class="wl">'+esc(wdName(i,'short'))+'</span><span class="ring">'+ringSvg(st.pct)+'<span>'+d.getDate()+'</span></span></button>';
  }
  const tst=rtStat(new Date());
  let h='<div class="g12"><div class="wk" role="group" aria-label="'+x('Week','สัปดาห์นี้')+'">'+strip+'</div>'
    +'<div class="stats three"><div class="stat"><span class="sn">'+streak()+'</span><span class="sl">'+x('Day streak','วันต่อเนื่อง')+'</span></div>'
    +'<div class="stat"><span class="sn">'+(wt?Math.round(wd/wt*100):0)+'%</span><span class="sl">'+x('This week','สัปดาห์นี้')+'</span></div>'
    +'<div class="stat"><span class="sn">'+tst.done+'/'+tst.total+'</span><span class="sl">'+x('Today','วันนี้')+'</span></div></div>'
    +'<p class="sub">'+x('A day counts toward the streak when you finish 80% or more.','นับเป็นวันต่อเนื่องเมื่อทำได้ตั้งแต่ 80% ขึ้นไป')+'</p></div>';
  const due=rtDue(sel.getDay()).slice().sort(timeCmp),done=rtDoneSet(rtDay),future=rtDay>tk;
  h+='<section class="sec"><div class="sec-h"><h2>'+(rtDay===tk?esc(x('Today','วันนี้'))+SP+esc(fShort(sel)):esc(fDay(sel)))+'</h2><button class="btn sm" data-act="addRt">'+PLUS+x('Add','เพิ่ม')+'</button></div>';
  if(!S.routines.items.length)h+=empty(x('No routines yet. Add the habits you want to repeat.','ยังไม่มีกิจวัตร เพิ่มสิ่งที่อยากทำซ้ำทุกวัน'),x('Add a routine','เพิ่มกิจวัตร'),'addRt');
  else if(!due.length)h+=empty(x('No routines on this day.','วันนี้ไม่มีกิจวัตร'));
  else{
    const P=PERIODS();
    [0,1,2,3].forEach(p=>{
      const rs=due.filter(r=>period(r)===p);if(!rs.length)return;

/* 7 Finance */
function donut(t){
  const R=42,C=2*Math.PI*R,parts=KINDS.filter(k=>t.by[k]>0),gap=parts.length>1?1.8:0;let off=0,segs='';
  parts.forEach(k=>{const len=t.by[k]/t.net*C,d=Math.max(0,len-gap);segs+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke-width="13" style="stroke:var(--k-'+k+')" stroke-dasharray="'+d.toFixed(2)+' '+(C-d).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len});
  let top=parts[0];parts.forEach(k=>{if(t.by[k]>t.by[top])top=k});
  return'<div class="donut" role="img" aria-label="'+x('Portfolio split by type','สัดส่วนพอร์ตแยกตามประเภท')+'"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke-width="13" style="stroke:var(--line)"/><g transform="rotate(-90 50 50)">'+segs+'</g></svg>'
    +'<div class="mid"><b>'+Math.round(t.by[top]/t.net*100)+'%</b><span>'+esc(kindName(top))+'</span></div></div>';
}

function fgCard(g){

  else{const m=needPerMonth(g);need=m<=0?'<b>'+x('On track:','ไปได้ตามเป้า:')+'</b> '+x('your savings will grow to the target by itself at this return.','เงินที่มีจะโตถึงเป้าเองด้วยผลตอบแทนนี้'):x('Save about ','ควรออมประมาณ ')+'<b class="mono">'+baht(m)+'</b> '+x('a month','ต่อเดือน')}

    +'<div class="fg-n"><span class="big">'+baht(sv)+'</span><span class="sub mono">'+x('of ','จาก ')+baht(t)+SP+Math.round(p)+'%</span></div>'
    +'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(p)+'" aria-label="'+esc(tr(g,'title'))+'"><i style="width:'+p+'%"></i></div>'
    +'<div class="g-meta"><span>'+(isKey(g.date)?x('By ','ภายใน ')+esc(fShort(fromKey(g.date)))+' '+fromKey(g.date).getFullYear()+(n>0?SP+(n>=12?x((n/12).toFixed(1).replace('.0','')+' yrs',(n/12).toFixed(1).replace('.0','')+' ปี'):x(n+' mo',n+' เดือน')):''):'')+'</span><span class="mono">'+x('Return ','ผลตอบแทน ')+nf2.format(num(g.ret))+'%/'+x('yr','ปี')+'</span></div>'

document.addEventListener('keydown',e=>{
  const ov=$('#ov');if(!ov||ov.hidden)return;
  if(e.key==='Escape'){closeForm();return}
  if(e.key==='Tab'){
    const f=$$('button,input,select,textarea,a[href]',$('#sheet')).filter(z=>!z.disabled&&z.offsetParent!==null);
    if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
});

const sampleErr=e=>{const c=e&&e.code;return c==='not_granted'?x('This page has not been allowed to use Claude.','ยังไม่ได้อนุญาตให้หน้านี้ใช้ Claude'):c==='rate_limited'?x('Too many requests. Try again in a moment.','ใช้งานถี่เกินไป ลองใหม่อีกครั้งในอีกสักครู่'):c==='invalid_json'?x('Could not read the result. Try again, or add the entry by hand.','อ่านผลลัพธ์ไม่ได้ ลองอีกครั้ง หรือเพิ่มรายการเอง'):x('Something went wrong. Try again.','เกิดข้อผิดพลาด ลองอีกครั้ง')};
function cleanImport(res,src){
  const arr=Array.isArray(res)?res:(res&&Array.isArray(res.items)?res.items:[]);
  return arr.slice(0,40).map(r=>{
    r=r||{};const type=r.type==='in'?'in':'out',amt=pnum(r.amount),cats=type==='in'?IN_CATS:OUT_CATS;
    return{date:isKey(r.date)?r.date:todayKey(),type:type,amount:Math.round(amt*100)/100,cat:cats.indexOf(r.cat)>-1?r.cat:(type==='in'?'inother':'other'),note:String(r.note||'').slice(0,60),src:(r.src==='line'||r.src==='email')?r.src:src};
  }).filter(r=>r.amount>0&&r.amount<1e9);
}
function importPrompt(text){
  return'Extract money transactions from the text below. It is pasted from bank or e-wallet emails or LINE notifications, in Thai or English. Today is '+todayKey()+'.\n'
   +'Reply with ONLY a JSON array. Each element: {"date":"YYYY-MM-DD","type":"in" or "out","amount":number in THB without commas,"cat":one of '+JSON.stringify(OUT_CATS.concat(IN_CATS))+',"note":"short merchant or description, max 40 characters"}.\n'
   +'Rules: use type "out" for spending, transfers out and bill payments; "in" for money received. Skip OTP codes, ads, balances and anything that is not a completed money movement. Use categories food, transport, shopping, bills, health, fun, other for "out" and salary, bonus, invest, inother for "in". If the year is missing use the current year; Buddhist Era years (25xx) are converted by subtracting 543. If there is no date use today. If nothing qualifies reply [].\n\nTEXT:\n"""\n'+text+'\n"""';
}

/* ---------- reminders ---------- */
/* A web app cannot wake itself once it is fully closed (Chrome stopped work on scheduled notifications), so reminders are
   checked every 15 seconds while the app is open or in the background, and anything missed in the last hour is shown
   the next time the app is opened. */
const NS_KEY='hb1notif',DEF_REMIND='09:00',CATCHUP=60*60*1000;
const notifPerm=()=>('Notification' in window)?Notification.permission:'unsupported';
const notifOn=()=>!!S.settings.notify&&notifPerm()==='granted';
let nState=(function(){try{const o=JSON.parse(localStorage.getItem(NS_KEY));if(o&&typeof o==='object')return{last:+o.last||0,fired:(o.fired&&typeof o.fired==='object')?o.fired:{}}}catch(e){}return{last:0,fired:{}}})();
const saveN=()=>{try{localStorage.setItem(NS_KEY,JSON.stringify(nState))}catch(e){}};
const atTime=(key,hm)=>{const p=key.split('-').map(Number),t=String(hm||DEF_REMIND).split(':').map(Number);return new Date(p[0],p[1]-1,p[2],t[0]||0,t[1]||0,0,0)};
const aheadOk=it=>isOneOff(it)||it.repeat==='weekly'||it.repeat==='monthly'; /* a day-before notice every single day would only be noise */
function remindEvents(t0,t1){
  const out=[],a=dateKey(new Date(t0)),b=dateKey(new Date(t1)),last=dateKey(addDays(fromKey(b),1));
  for(let d=fromKey(a);dateKey(d)<=last;d=addDays(d,1)){
    const k=dateKey(d);
    S.schedule.items.forEach(it=>{
      if(!occursOn(it,k))return;
      const hm=it.time||DEF_REMIND,title=(it.star?'★ ':'')+tr(it,'title'),at=atTime(k,hm);
      if(k<=b&&at>t0&&at<=t1&&!isDone(it,k))out.push({id:it.id+'|now|'+k,at:+at,title:title,body:it.time?x('It is time. ','ถึงเวลาแล้ว ')+it.time:x('Due today','ถึงกำหนดวันนี้'),tag:'t-'+it.id+'-'+k});
      if(aheadOk(it)){const ah=atTime(dateKey(addDays(d,-1)),hm);if(ah>t0&&ah<=t1)out.push({id:it.id+'|ahead|'+k,at:+ah,title:title,body:it.time?x('Tomorrow at ','พรุ่งนี้ เวลา ')+it.time:x('Due tomorrow','ถึงกำหนดพรุ่งนี้'),tag:'a-'+it.id+'-'+k})}
    });
    if(k<=b)S.routines.items.forEach(r=>{
      if(!r.time||(r.days&&r.days.length&&r.days.indexOf(d.getDay())<0))return;
      const at=atTime(k,r.time);
      if(at>t0&&at<=t1&&!rtDoneSet(k).has(r.id))out.push({id:r.id+'|rt|'+k,at:+at,title:tr(r,'title'),body:x('Routine time ','ถึงเวลากิจวัตร ')+r.time,tag:'r-'+r.id+'-'+k});
    });
  }
  return out.sort((p,q)=>p.at-q.at);
}
async function showN(ev){
  const o={body:ev.body,tag:ev.tag,icon:'icons/icon-192.png',data:{view:'today'}};
  try{
    const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,no)=>setTimeout(()=>no(new Error('sw')),3000))]);
    await reg.showNotification(ev.title,o);return true;
  }catch(e){try{new Notification(ev.title,o);return true}catch(e2){return false}}
}
function checkReminders(){
  if(!loaded)return;
  const now=Date.now();
  if(!notifOn()){nState.last=now;saveN();return} /* keep the clock fresh so switching on later does not replay old items */
  const t0=Math.max(nState.last||now,now-CATCHUP);
  nState.last=now;
  const evs=remindEvents(t0,now).filter(e=>!nState.fired[e.id]);
  evs.forEach(e=>{nState.fired[e.id]=now});
  Object.keys(nState.fired).forEach(k=>{if(now-nState.fired[k]>3*864e5)delete nState.fired[k]});
  saveN();
  evs.slice(0,4).forEach(showN);
  if(evs.length>4)showN({title:x('Reminders','การแจ้งเตือน'),body:x('and '+(evs.length-4)+' more','และอีก '+(evs.length-4)+' รายการ'),tag:'hb-more'});
}
let notifNote='';
async function setNotify(on){
  notifNote='';
  if(!on){S.settings.notify=false;touch('settings');repaintSheet();return}
  const p0=notifPerm();
  if(p0==='unsupported')notifNote='unsupported';
  else{
    let p=p0;
    if(p==='default'){try{p=await Notification.requestPermission()}catch(e){p=notifPerm()}}
    if(p==='granted'){S.settings.notify=true;touch('settings');nState.last=Date.now();saveN()}
    else notifNote=p==='denied'?'denied':'asked';
  }
  repaintSheet();
}
function notifHtml(seg){
  const p=notifPerm(),on=notifOn();let msg;
  if(p==='unsupported'||notifNote==='unsupported')msg=x('This browser does not support notifications.','เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน');
  else if(p==='denied'||notifNote==='denied')msg=x('Notifications are blocked for this site. Open the site settings in Chrome, allow Notifications, then come back and switch this on.','การแจ้งเตือนถูกบล็อกไว้ ไปที่การตั้งค่าเว็บไซต์ใน Chrome แล้วอนุญาตการแจ้งเตือน จากนั้นกลับมาเปิดอีกครั้ง');
  else if(notifNote==='asked')msg=x('Permission was not given. Switch on again and tap Allow.','ยังไม่ได้อนุญาต เปิดอีกครั้งแล้วกดอนุญาต');
  else if(notifNote==='failed')msg=x('Could not show a notification. Check the Notifications permission for this site.','แสดงแจ้งเตือนไม่ได้ ตรวจสอบสิทธิ์การแจ้งเตือนของเว็บนี้');
  else if(on)msg=x('You will be notified when a task, routine or scheduled item is due, and one day before scheduled items.','จะแจ้งเตือนเมื่อถึงเวลาของงาน กิจวัตร และกำหนดการ และเตือนล่วงหน้า 1 วันสำหรับกำหนดการ');
  else msg=x('Get a notification when it is time for a task, routine or scheduled item.','รับแจ้งเตือนเมื่อถึงเวลาของงาน กิจวัตร และกำหนดการ');
  return'<div class="set-g"><span class="lbl">'+x('Notifications','การแจ้งเตือน')+'</span>'+seg([['on',x('On','เปิด')],['off',x('Off','ปิด')]],on?'on':'off','setNotify')+'<small role="status">'+msg+'</small>'
    +(on?'<div><button type="button" class="btn sm" data-act="notifTest">'+x('Send a test','ส่งแจ้งเตือนทดสอบ')+'</button></div>':'')
    +'<small>'+x('Limit: a web app cannot wake itself once it is fully closed. Reminders arrive on time while the app is open or recently used. After it was closed, anything you missed in the last hour shows up when you open it again.','ข้อจำกัด: เว็บแอปปลุกตัวเองไม่ได้เมื่อปิดแอปสนิท แจ้งเตือนจึงตรงเวลาตอนเปิดแอปไว้หรือเพิ่งใช้งาน ถ้าปิดแอปไปแล้ว จะเห็นงานที่พลาดไม่เกิน 1 ชั่วโมงเมื่อเปิดแอปอีกครั้ง')+'</small></div>';
}

/* ---------- celebration when a task is ticked off ---------- */
const FX_COLORS=['#FF4D4F','#FFB020','#FFE14D','#34D399','#38BDF8','#A78BFA','#F472B6'];
const FX_MONEY=['💵','🪙','💰','💵','🪙','💸'];
const rnd=(a,b)=>a+Math.random()*(b-a);
function celebrate(){
  const old=$$('.fx');while(old.length>1)old.shift().remove();
  const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const host=document.createElement('div');host.className='fx';host.setAttribute('aria-hidden','true');document.body.appendChild(host);
  const W=window.innerWidth,H=window.innerHeight;
  const add=(html,css,frames,opt)=>{const el=document.createElement('span');el.textContent=html;el.style.cssText=css;host.appendChild(el);if(el.animate)el.animate(frames,opt)};
  /* the flexed arm pops up in the middle */
  add('💪','font-size:96px;left:50%;top:36%;opacity:0',
    reduce?[{opacity:0,transform:'translate(-50%,-50%)'},{opacity:1,transform:'translate(-50%,-50%)',offset:.2},{opacity:1,transform:'translate(-50%,-50%)',offset:.7},{opacity:0,transform:'translate(-50%,-50%)'}]
    :[{opacity:0,transform:'translate(-50%,-50%) scale(.2) rotate(-18deg)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.25) rotate(6deg)',offset:.3},{opacity:1,transform:'translate(-50%,-50%) scale(1) rotate(0deg)',offset:.55},{opacity:1,transform:'translate(-50%,-56%) scale(1)',offset:.8},{opacity:0,transform:'translate(-50%,-70%) scale(.9)'}],
    {duration:reduce?1100:1700,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
  if(!reduce){
    /* fireworks: three bursts of dots */
    for(let b=0;b<3;b++){
      const cx=rnd(W*.18,W*.82),cy=rnd(H*.14,H*.5),n=16;
      for(let i=0;i<n;i++){
        const ang=i/n*Math.PI*2+rnd(-.15,.15),dist=rnd(55,115),s=rnd(5,8),dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist;
        add('','width:'+s.toFixed(1)+'px;height:'+s.toFixed(1)+'px;border-radius:50%;opacity:0;background:'+FX_COLORS[(b*3+i)%FX_COLORS.length]+';left:'+cx.toFixed(0)+'px;top:'+cy.toFixed(0)+'px',
          [{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx.toFixed(0)+'px,'+dy.toFixed(0)+'px) scale(1)',opacity:1,offset:.6},{transform:'translate('+(dx*1.15).toFixed(0)+'px,'+(dy*1.15+26).toFixed(0)+'px) scale(.3)',opacity:0}],
          {duration:rnd(800,1100),delay:b*220,easing:'cubic-bezier(.1,.7,.3,1)',fill:'forwards'});
      }
    }
    /* paper money and coins drift down */
    for(let i=0;i<16;i++){
      const sway=rnd(-60,60),rot=rnd(-240,240);
      add(FX_MONEY[i%FX_MONEY.length],'font-size:'+rnd(26,40).toFixed(0)+'px;left:'+rnd(0,Math.max(0,W-40)).toFixed(0)+'px;top:-50px;opacity:0',
        [{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+sway.toFixed(0)+'px,'+(H*.55).toFixed(0)+'px) rotate('+(rot/2).toFixed(0)+'deg)',opacity:1,offset:.6},{transform:'translate('+(sway*1.4).toFixed(0)+'px,'+(H+40)+'px) rotate('+rot.toFixed(0)+'deg)',opacity:.9}],
        {duration:rnd(1500,2300),delay:rnd(0,500),easing:'cubic-bezier(.3,.1,.6,1)',fill:'forwards'});
    }
  }
  setTimeout(()=>host.remove(),2900);
}

/* ---------- actions ---------- */
function toggleDone(id,key){
  const it=S.schedule.items.find(z=>z.id===id);if(!it)return;
  const ix=it.doneDates.indexOf(key);let ticked=false;
  if(ix>-1)it.doneDates.splice(ix,1);else{it.doneDates.push(key);ticked=true}
  touch('schedule');render();
  if(ticked)celebrate();
}
function quickAdd(f,inp,val){
  const tm=f.elements.tm,err=$('#qa-err');
  if(!val){inp.focus();return}
  if(!tm||!/^\d{2}:\d{2}$/.test(tm.value)){
    if(err){err.textContent=x('Pick a time for this task first.','เลือกเวลาของงานนี้ก่อน');err.hidden=false}
    if(tm){tm.focus();try{if(tm.showPicker)tm.showPicker()}catch(e){}}
    return;
  }
  S.schedule.items.push({id:uid(),title:val,date:todayKey(),time:tm.value,end:'',note:'',repeat:'none',doneDates:[],star:false});
  touch('schedule');inp.value='';tm.value='';render();
  const t2=$('form.qa input[name=t]');if(t2)t2.focus({preventScroll:true}); /* ready for the next task */
}
function act(a,ds){
  switch(a){
    case'tab':go(ds.v);break;
    case'settings':pendingRestore=null;restoreNote='';openSheet(settingsHtml(),'settings');break;
    case'exportData':exportData();break;
    case'restoreData':pickRestore();break;
    case'cancelRestore':pendingRestore=null;restoreNote='';repaintSheet();break;
    case'doRestore':doRestore();break;
    case'closeSheet':closeForm();break;
    case'setLang':setSetting('lang',ds.v==='en'?'en':'th');break;
    case'setTheme':setSetting('theme',ds.v);break;
    case'setWk':setSetting('wk',ds.v==='on');break;
    case'setColor':{S.settings.colors=S.settings.colors||{};S.settings.colors[ds.d]=ds.v;touch('settings');applyTheme();render();repaintSheet();break}
    case'clearSeeds':arm('clr',()=>{clearSeeds();render();repaintSheet()});break;
    case'retry':setSave('saving');Object.keys(dirty).forEach(n=>{if(dirty[n])flush(n)});break;
    /* tasks */
    case'toggleTask':toggleDone(ds.id,ds.k);break;
    case'toggleStar':{const it=S.schedule.items.find(z=>z.id===ds.id);if(!it)break;it.star=!it.star;touch('schedule');render();break}
    case'openFilter':openFilter();break;
    case'setFilter':todayFilter=FILTERS().some(f=>f[0]===ds.v)?ds.v:'all';closeForm();render();break;
    case'setNotify':setNotify(ds.v==='on');break;
    case'notifTest':showN({title:x('Home Base test','ทดสอบ Home Base'),body:x('Notifications are working.','แจ้งเตือนใช้งานได้'),tag:'hb-test'}).then(ok=>{notifNote=ok?'':'failed';repaintSheet()});break;
    case'addTask':formTask(null,selDate);break;
    case'editTask':formTask(ds.id);break;
    case'selDay':selDate=ds.k;render();break;
    case'calPrev':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1,12);render();break;
    case'calNext':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1,12);render();break;
    case'calToday':{const n=new Date();calMonth=new Date(n.getFullYear(),n.getMonth(),1,12);selDate=todayKey();render();break}
    /* goals */
    case'addGoal':formGoal(null,ds.term);break;
    case'editGoal':formGoal(ds.id);break;
    case'toggleSub':{const g=S.goals.items.find(z=>z.id===ds.g),s=g&&g.subs.find(z=>z.id===ds.id);if(!s)break;s.done=!s.done;touch('goals');render();break}
    case'rmSub':{const g=S.goals.items.find(z=>z.id===ds.g);if(!g)break;g.subs=g.subs.filter(z=>z.id!==ds.id);touch('goals');render();break}
    /* diary */
    case'openDiary':formDiary(ds.k);break;
    /* routine */
    case'rtDay':rtDay=ds.k;render();break;
    case'addRt':formRoutine();break;
    case'editRt':formRoutine(ds.id);break;
    case'toggleRt':{
      const k=ds.k;if(!isKey(k)||k>todayKey())break;
      const r=S.routines.items.find(z=>z.id===ds.id);if(!r)break;
      const set=new Set(S.routines.log[k]||[]);if(set.has(r.id))set.delete(r.id);else set.add(r.id);
      if(set.size)S.routines.log[k]=[...set];else delete S.routines.log[k];
      touch('routines');render();break;
    }
    /* finance */
    case'finTab':finTab=ds.v;render();break;
    case'addAsset':pickAsset();break;
    case'pickAsset':closeForm();formAsset(ds.k);break;
    case'editAsset':formAsset(null,ds.id);break;
    case'prices':formPrices();break;
    case'addFg':formFg(null,ds.term);break;
    case'editFg':formFg(ds.id);break;
    case'addSaving':formSaving(ds.id);break;
    case'flowPrev':case'flowNext':{const d=fromKey(flowYm+'-01');flowYm=dateKey(new Date(d.getFullYear(),d.getMonth()+(a==='flowNext'?1:-1),1,12)).slice(0,7);render();break}
    case'addTx':formTx();break;
    case'editTx':formTx(ds.id);break;
    case'importTx':if(sampleFn)openImport();break;
    case'runImport':runImport();break;
    case'reviewInbox':openPreview(cleanImport(S.inbox.items,'email'),'inbox');break;
    case'dismissInbox':S.inbox.items=[];touch('inbox');closeForm();render();break;
    case'togglePrev':{const i=+ds.i;if(prevSel.has(i))prevSel.delete(i);else prevSel.add(i);paintPreview();const b=$('[data-act="togglePrev"][data-i="'+i+'"]');if(b)b.focus({preventScroll:true});break}
    case'addPreview':{
      const chosen=prevItems.filter((_,i)=>prevSel.has(i));
      if(chosen.length){addTxns(chosen);flowYm=chosen[0].date.slice(0,7);finTab='flow'}
      if(prevFrom==='inbox'){S.inbox.items=[];touch('inbox')}
      closeForm();render();break;
    }
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  act(el.dataset.act,el.dataset);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-submit]');if(!f)return;
  e.preventDefault();
  const inp=f.elements.t,val=inp?inp.value.trim():'';
  if(f.dataset.submit==='quickAdd'){quickAdd(f,inp,val);return}
  if(!val)return;
  if(f.dataset.submit==='addSub'){const g=S.goals.items.find(z=>z.id===f.dataset.g);if(!g)return;g.subs.push({id:uid(),text:val,done:false});touch('goals')}
  inp.value='';render();
});
document.addEventListener('input',e=>{
  if(e.target.id!=='dtext')return;
  diarySet(diaryKey,e.target.value);
  clearTimeout(dTimer);
  dTimer=setTimeout(()=>{const g=$('#dgrid');if(view==='diary'&&g){const all=diaryAll();g.innerHTML=diaryGrid(all);const c=$('#dcount');if(c)c.textContent=all.length}},900);
});
document.addEventListener('change',e=>{
  if(e.target.name==='tm'&&e.target.form&&e.target.form.dataset.submit==='quickAdd'){
    /* picking a time finishes the add: with a title typed it is added, otherwise jump to the title box */
    const f=e.target.form,t=f.elements.t;
    if(!e.target.value)return;
    if(t.value.trim())f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));else t.focus();
    return;
  }
  if(e.target.id==='ddate'){const v=e.target.value;if(isKey(v)&&v<=todayKey()){diaryKey=v;render()}}
});
window.addEventListener('hashchange',()=>{const v=readHash();if(v!==view){view=v;render();window.scrollTo(0,0)}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  checkReminders();
  if(Date.now()-newsAt>1800000)loadNews();
  const nk=todayKey();
  if(nk!==lastKey){
    if(selDate===lastKey)selDate=nk;if(rtDay===lastKey)rtDay=nk;if(diaryKey===lastKey)diaryKey=nk;
    lastKey=nk;applyTheme();render();
  }
});

/* ---------- data ---------- */
function onSnap(snap){
  if(!snap.metadata.fromCache){confirmed=true;slow=false;clearTimeout(slowT)}
  let changed=false;
  snap.docs.forEach(d=>{
    if(!isDoc(d.id)||dirty[d.id]||busy[d.id]||timers[d.id])return;
    const nv=norm(d.id,d.data());
    if(S[d.id]&&JSON.stringify(S[d.id])===JSON.stringify(nv))return; /* unchanged: keep the same objects so open forms stay valid */
    S[d.id]=nv;changed=true;
  });
  const first=!loaded;loaded=true;
  if(first||changed){applyTheme();render(true);repaintSheet()}
}
/* ---------- on-device storage: replaces the Claude database ---------- */
const LS='hb1:',NEWS_KEY='hb1news';
const localDb=(function(){
  const subs=[];
  const ids=()=>{const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(LS)===0)o.push(k.slice(LS.length))}}catch(e){}return o};
  const readDoc=id=>{try{return JSON.parse(localStorage.getItem(LS+id))||{}}catch(e){return{}}};
  const snap=()=>({docs:ids().filter(isDoc).map(id=>({id:id,data:()=>readDoc(id)})),metadata:{fromCache:false}});
  window.addEventListener('storage',e=>{if(e.key&&e.key.indexOf(LS)===0){const s=snap();subs.forEach(cb=>cb(s))}});
  return{
    doc:id=>({set:d=>new Promise((ok,no)=>{try{localStorage.setItem(LS+id,JSON.stringify(d));ok()}catch(e){no(e)}})}),
    onSnapshot:cb=>{subs.push(cb);setTimeout(()=>cb(snap()),0)}
  };
})();

/* ---------- daily news: news.json is rebuilt each morning by a GitHub Action ---------- */
let newsAt=0;
function applyNews(j){if(!j||typeof j!=='object')return false;S.brief=norm('brief',j);return true}
async function loadNews(){
  try{
    const r=await fetch('news.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(applyNews(j)){
      try{localStorage.setItem(NEWS_KEY,JSON.stringify(j))}catch(e){}
      newsAt=Date.now();
      if(loaded)render(true);
    }
  }catch(e){}
}

/* ---------- backup / restore (data lives only on this phone) ---------- */
let pendingRestore=null,restoreNote='';
const EXPORTABLE=n=>isDoc(n)&&n!=='brief'&&n!=='inbox';
function exportData(){
  const out={app:'home-base',v:1,at:new Date().toISOString(),docs:{}};
  Object.keys(S).forEach(n=>{if(EXPORTABLE(n))out.docs[n]=pruned(n)});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
  a.download='home-base-backup-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  restoreNote=x('Backup file saved. Find it in your Files app under Downloads.','บันทึกไฟล์สำรองแล้ว ดูได้ในแอปไฟล์ ที่โฟลเดอร์ดาวน์โหลด');
  repaintSheet();
}
function pickRestore(){
  const i=document.createElement('input');
  i.type='file';i.accept='application/json,.json';i.style.display='none';
  i.addEventListener('change',()=>{
    const f=i.files&&i.files[0];i.remove();
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let o=null;try{o=JSON.parse(String(r.result))}catch(e){}
      const names=o&&o.app==='home-base'&&o.docs&&typeof o.docs==='object'?Object.keys(o.docs).filter(EXPORTABLE):[];
      if(!names.length){pendingRestore=null;restoreNote=x('That file is not a Home Base backup.','ไฟล์นี้ไม่ใช่ไฟล์สำรองของ Home Base')}
      else{pendingRestore={docs:o.docs,names:names};restoreNote=''}
      repaintSheet();
    };
    r.onerror=()=>{restoreNote=x('Could not read that file.','อ่านไฟล์ไม่สำเร็จ');repaintSheet()};
    r.readAsText(f);
  });
  document.body.appendChild(i);i.click();
}
function doRestore(){
  if(!pendingRestore)return;
  const keep=pendingRestore.docs;
  Object.keys(S).forEach(n=>{if(EXPORTABLE(n)&&!keep[n]){S[n]=norm(n,{});touch(n)}});
  pendingRestore.names.forEach(n=>{S[n]=norm(n,keep[n]);touch(n)});
  pendingRestore=null;restoreNote=x('Backup restored.','กู้คืนข้อมูลแล้ว');
  applyTheme();render();repaintSheet();
}
function backupHtml(){
  let h='<div class="set-g"><span class="lbl">'+x('Backup','สำรองข้อมูล')+'</span><small>'+x('Your data is stored only on this phone. Save a backup file now and then, in case you change phones or clear the browser data.','ข้อมูลเก็บอยู่ในมือถือเครื่องนี้เท่านั้น ควรบันทึกไฟล์สำรองไว้เป็นระยะ เผื่อเปลี่ยนเครื่องหรือล้างข้อมูลเบราว์เซอร์')+'</small>';
  if(pendingRestore)h+='<div class="note warn" role="alert"><span>'+x('Replace all data on this phone with this backup ('+pendingRestore.names.length+' sections)?','แทนที่ข้อมูลทั้งหมดในมือถือเครื่องนี้ด้วยไฟล์สำรอง ('+pendingRestore.names.length+' ส่วน)?')+'</span></div>'
    +'<div class="row-btns"><button type="button" class="btn" data-act="cancelRestore">'+x('Cancel','ยกเลิก')+'</button><button type="button" class="btn danger" data-act="doRestore">'+x('Replace my data','แทนที่ข้อมูล')+'</button></div>';
  else h+='<div class="row-btns"><button type="button" class="btn" data-act="exportData">'+x('Save backup','บันทึกไฟล์สำรอง')+'</button><button type="button" class="btn" data-act="restoreData">'+x('Restore','กู้คืน')+'</button></div>';
  if(restoreNote)h+='<small role="status">'+esc(restoreNote)+'</small>';
  return h+'</div>';
}

async function boot(){
  applyTheme();view=readHash();render();
  userId='local';dbReady=true;col=localDb;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{const c=localStorage.getItem(NEWS_KEY);if(c)applyNews(JSON.parse(c))}catch(e){}
  loadNews();
  col.onSnapshot(onSnap);
  setInterval(checkReminders,15000);
  window.addEventListener('focus',checkReminders);
  window.addEventListener('pageshow',checkReminders);
  try{navigator.serviceWorker.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='hb-go'&&VIEW_IDS.indexOf(d.view)>-1)go(d.view)})}catch(e){}
}
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(centerTab)}catch(e){}
window.addEventListener('resize',centerTab);
boot();
})();
